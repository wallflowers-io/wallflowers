# docs.wallflowers.io: THE COMMUNITY API DOCUMENTATION, in its own container on the Arc's
# box (deploy-docs.sh), reached by the `wallflowers` tunnel at 127.0.0.1:8082.
#
# /srv is ~/wallflowers-docs on the box; /srv/current names the live release, one
# directory per commit: docs/ is app/door/docs/dist as built, hack-seoul.html beside it.
# A deploy moves the link, so a request sees one release or the other, never a mix.
#
# Plain files -- HTML, agents.md, llms.txt, routes.json, a stylesheet -- and no script at
# all, which the CSP below holds them to. A path the tree does not hold is a 404.
#
# EVERY add_header IS AT SERVER LEVEL, AND IT HAS TO BE. nginx inherits add_header
# into a location only when that location declares none of its own, so a single
# add_header in a location below would silently drop the CSP from everything it
# serves. What varies by path (CORS) varies through $docs_cors instead; an empty
# value sends no header.
#
# This file is included inside http{} (conf.d), where `map` belongs.
map $uri $docs_cors {
    default       "";
    # Fetched by agents and tools from any origin, so any origin may read them.
    /agents.md    "*";
    /llms.txt     "*";
    /routes.json  "*";
}

server {
    listen       8080;
    server_name  _;
    root   /srv/current/docs;
    index  index.html;
    # Relative redirects: behind the tunnel nginx sees only plain http on 8080, so an
    # absolute Location would name that.
    absolute_redirect off;
    charset utf-8;

    # default-src 'none' runs no script from anywhere. Styles and images from this
    # origin (inline styles too), fonts from this origin; nothing may frame the page,
    # post a form or rebase its links.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # REVALIDATE EVERYTHING. The docs are a few small files and nothing in them
    # carries a ?v=, so a stylesheet held at the edge would outlive the pages that
    # ask for it just as a page would. no-cache lets Cloudflare and the browser keep
    # a copy but ask (a cheap 304 on the etag) before every use, so a deploy of new
    # docs is seen on the next request.
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin $docs_cors always;

    # /routes becomes routes.html; /guide/ its index.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The folder itself holds no page: its two files are linked from the quickstart,
    # which says what to do with them. Exact matches, so they win over ^~ below.
    location = /starter {
        return 302 /quickstart.html;
    }
    location = /starter/ {
        return 302 /quickstart.html;
    }

    # THE STARTER IS A DOWNLOAD: its index.html and app.js go out as plain text, so
    # nothing runs on this origin (the CSP runs no script anyway) and a browser shows or
    # saves them. ^~ so no regex location below takes them.
    location ^~ /starter/ {
        types { }
        default_type text/plain;
        try_files $uri =404;
    }

    # /hack-seoul: the hackathon's page (Ralph, 1 Oct, "please host this at
    # docs.wallflowers.io/hack-seoul"). One self-contained file, kept OUT of dist/: its inline script and data: font need a CSP of their own, which the tree's
    # no-script rule would refuse. A location's add_header drops every server-level
    # one (above), so each is restated here; CORS is not, as the page is no API.
    location = /hack-seoul {
        alias /srv/current/hack-seoul.html;
        types { }
        default_type text/html;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: 'self'; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # agents.md and llms.txt are read by agents as text. mime.types has no .md at
    # all (it would go out as application/octet-stream, a download), so both are
    # typed here by extension. An empty `types` in a location replaces the table
    # for that location only; `charset` above adds the utf-8.
    location ~* \.(md|txt)$ {
        types { }
        default_type text/plain;
        try_files $uri =404;
    }
}
