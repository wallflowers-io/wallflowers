<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">A WallFlowers community, its parts, its public page, and an app</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#14181E"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #14181E; }
      .h { font-size: 34px; font-weight: 700; }
      .s { font-size: 22px; fill: #5B6370; }
      .p { font-size: 28px; font-weight: 650; }
      .q { font-size: 20px; fill: #5B6370; }
      .k { font-size: 21px; font-weight: 600; fill: #5B6370; letter-spacing: .08em; }
      .m { font-family: ui-monospace, Menlo, monospace; font-size: 19px; fill: #5B6370; }
      .ln { stroke: #14181E; stroke-width: 2.5; fill: none; }
      .card { fill: #FFFFFF; stroke: #D9DCE2; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FBFAF6"/>

  <!-- THE PUBLIC PAGE -->
  <g transform="translate(60 150)">
    <rect x="0" y="0" width="250" height="500" rx="38" fill="#14181E"/>
    <rect x="10" y="10" width="230" height="480" rx="30" fill="#FBFAF6"/>
    <circle cx="125" cy="80" r="34" fill="#469C48"/>
    <text x="125" y="91" text-anchor="middle" style="font-size:30px;font-weight:700;fill:#fff">H</text>
    <text x="125" y="148" text-anchor="middle" style="font-size:22px;font-weight:650">Harbour Lane</text>
    <rect x="30" y="172" width="190" height="78" rx="14" class="card"/>
    <rect x="46" y="190" width="90" height="10" rx="5" fill="#DBADCF"/>
    <rect x="46" y="212" width="150" height="10" rx="5" fill="#E6E8EC"/>
    <rect x="30" y="264" width="90" height="90" rx="14" class="card"/>
    <rect x="130" y="264" width="90" height="90" rx="14" class="card"/>
    <circle cx="75" cy="309" r="12" fill="#546CAC"/>
    <rect x="146" y="290" width="58" height="10" rx="5" fill="#C1B350"/>
    <rect x="30" y="368" width="190" height="62" rx="14" class="card"/>
    <rect x="46" y="388" width="120" height="10" rx="5" fill="#E6E8EC"/>
    <rect x="70" y="446" width="110" height="30" rx="15" fill="#14181E"/>
  </g>
  <text x="185" y="700" text-anchor="middle" class="p">Public page</text>
  <text x="185" y="732" text-anchor="middle" class="m">wallflowers.io/harbour-lane</text>

  <!-- THE COMMUNITY -->
  <rect x="400" y="90" width="660" height="720" rx="36" fill="#FFFFFF" stroke="#14181E" stroke-width="3"/>
  <text x="440" y="148" class="h">Community</text>
  <text x="440" y="182" class="s">Harbour Lane</text>

  <text x="440" y="240" class="k">MEMBERS</text>
  <g>
    <circle cx="470" cy="300" r="30" fill="#E57D8B"/><text x="470" y="309" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#fff">A</text>
    <circle cx="545" cy="300" r="30" fill="#418CB2"/><text x="545" y="309" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#fff">L</text>
    <circle cx="620" cy="300" r="30" fill="#469C48"/><text x="620" y="309" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#fff">T</text>
    <circle cx="695" cy="300" r="30" fill="#CF84A8"/><text x="695" y="309" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#fff">P</text>
    <circle cx="770" cy="300" r="30" fill="#E79D51"/><text x="770" y="309" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#fff">J</text>
    <circle cx="845" cy="300" r="30" fill="#546CAC"/><text x="845" y="309" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#fff">I</text>
    <text x="900" y="309" class="s">+122</text>
  </g>
  <!-- a Link: two members, connected -->
  <path d="M545 334 C 570 380, 670 380, 695 334" stroke="#14181E" stroke-width="2.5" stroke-dasharray="7 7" fill="none"/>
  <text x="620" y="398" text-anchor="middle" class="q">Link</text>

  <!-- the parts -->
  <g transform="translate(440 430)">
    <rect x="0" y="0" width="280" height="160" rx="22" class="card"/>
    <rect x="0" y="0" width="12" height="160" rx="6" fill="#546CAC"/>
    <text x="36" y="62" class="p">Rooms</text>
    <text x="36" y="100" class="q">messages</text>
    <text x="36" y="128" class="q">replies · reactions</text>

    <rect x="300" y="0" width="280" height="160" rx="22" class="card"/>
    <rect x="300" y="0" width="12" height="160" rx="6" fill="#DBADCF"/>
    <text x="336" y="62" class="p">Events</text>
    <text x="336" y="100" class="q">RSVPs · lineup</text>
    <text x="336" y="128" class="q">photos · the wall</text>

    <rect x="0" y="180" width="280" height="160" rx="22" class="card"/>
    <rect x="0" y="180" width="12" height="160" rx="6" fill="#C1B350"/>
    <text x="36" y="242" class="p">Resources</text>
    <text x="36" y="280" class="q">articles · PDFs</text>
    <text x="36" y="308" class="q">comments</text>

    <rect x="300" y="180" width="280" height="160" rx="22" class="card"/>
    <rect x="300" y="180" width="12" height="160" rx="6" fill="#469C48"/>
    <text x="336" y="242" class="p">Listings</text>
    <text x="336" y="280" class="q">Trade</text>
    <text x="336" y="308" class="q">selling · wanted</text>
  </g>

  <!-- community → public page -->
  <path d="M400 450 L 322 450" class="ln" marker-end="url(#ar)"/>
  <text x="361" y="436" text-anchor="middle" class="q">public</text>

  <!-- THE COMMUNITY API -->
  <rect x="1092" y="150" width="62" height="600" rx="31" fill="#14181E"/>
  <text transform="translate(1132 450) rotate(-90)" text-anchor="middle" style="font-size:26px;font-weight:650;fill:#FBFAF6;letter-spacing:.06em">Community API</text>
  <path d="M1060 450 L 1092 450" stroke="#14181E" stroke-width="6"/>

  <!-- the two apps on the same API -->
  <g transform="translate(1280 150)">
    <rect x="0" y="0" width="290" height="230" rx="26" class="card"/>
    <text x="28" y="58" class="p">WallFlowers</text>
    <text x="28" y="92" class="m">app.wallflowers.io</text>
    <text x="28" y="150" class="q">members</text>
    <text x="28" y="180" class="q">phone · desktop</text>
  </g>
  <g transform="translate(1280 520)">
    <rect x="0" y="0" width="290" height="230" rx="26" fill="#FFFFFF" stroke="#14181E" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="28" y="58" class="p">Your app</text>
    <text x="28" y="92" class="m">localhost · your URL</text>
    <text x="28" y="150" class="q">its own client</text>
    <text x="28" y="180" class="q">one community</text>
  </g>
  <path d="M1278 265 L 1162 265" class="ln" marker-end="url(#ar)"/>
  <text x="1218" y="250" text-anchor="middle" class="q">read · write</text>
  <path d="M1278 600 L 1162 600" class="ln" marker-end="url(#ar)"/>
  <text x="1218" y="585" text-anchor="middle" class="q">sign in</text>
  <path d="M1278 680 L 1162 680" class="ln" marker-end="url(#ar)"/>
  <text x="1218" y="665" text-anchor="middle" class="q">read · write</text>

  <!-- the member who signs in -->
  <circle cx="1425" cy="830" r="26" fill="#418CB2"/>
  <text x="1425" y="839" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#fff">L</text>
  <path d="M1425 802 L 1425 758" class="ln" marker-end="url(#ar)"/>
  <text x="1465" y="838" class="q">a member</text>
</svg>
