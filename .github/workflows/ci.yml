# Every job calls a Makefile target: the Makefile is the one way to build and test.
# Jobs run on wf-runner, a Lima VM on Ralph's Mac with the toolchain installed (label wf-mac),
# and only for Ralph's pushes. There is no pull_request trigger, so a fork runs nothing on that
# machine; a push run's checks land on the commit, which is what a PR's required checks read.
# The runner takes one job at a time and is offline while the Mac sleeps.
# Not here yet: check-harness (red on main: the ICD has no components.messages).
# Checks against business/website (another repository) say NOT RUN and do not fail.

name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: never
  # Tests built at opt-level 1: in debug, core's MLS suites run several times slower.
  # Debug assertions and overflow checks are separate settings and stay on.
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  icd:
    name: icd
    if: github.actor == 'phezman'
    runs-on: [self-hosted, wf-mac]
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # icd-released.py reads the newest icd/* tag; the docs read door-release's commit
          clean: false
      - &clean
        name: clean, keeping the build caches
        run: git clean -ffdx -e target/
      - run: make check-icd

  auth:
    name: auth
    if: github.actor == 'phezman'
    runs-on: [self-hosted, wf-mac]
    timeout-minutes: 10
    steps:
      - *checkout
      - *clean
      - run: make check-auth

  core:
    name: core
    if: github.actor == 'phezman'
    runs-on: [self-hosted, wf-mac]
    timeout-minutes: 60
    steps:
      - *checkout
      - *clean
      - run: make check-core
      - &output
        name: suite output
        if: failure() || cancelled()
        run: tail -n 400 "${TMPDIR:-/tmp}"/pinned-* 2>/dev/null || true  # each runner has its own TMPDIR

  arc:
    name: arc
    if: github.actor == 'phezman'
    runs-on: [self-hosted, wf-mac]
    timeout-minutes: 60
    steps:
      - *checkout
      - *clean
      - run: make check-arc
      - *output

  door:
    name: door
    if: github.actor == 'phezman'
    runs-on: [self-hosted, wf-mac]
    timeout-minutes: 45
    steps:
      - *checkout
      - *clean
      - run: make check-door
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
      - *output
