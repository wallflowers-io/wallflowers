# The four deploys, each a Makefile target, chosen when the run is started. Only from main,
# only by Ralph, only in the production environment (its reviewers approve each run; its secret
# is the deploy key), one run at a time. Order when several are chosen: arc, door, app; docs apart.
# Built on Ralph's Mac (label wf-ci) while `make ci` serves: start it after dispatching. Each job's
# container, holding the key, is deleted when the job ends.

name: deploy

on:
  workflow_dispatch:
    inputs:
      arc:
        description: "arc: the planes -> wallflowers-01, and the account store when arc/auth changed"
        type: boolean
        default: false
      door:
        description: "door: the Door -> door-01 (the restart ends every session)"
        type: boolean
        default: false
      app:
        description: "app: the webapp -> app.wallflowers.io (no restart)"
        type: boolean
        default: false
      docs:
        description: "docs: docs.wallflowers.io"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  DEPLOY_KEY: /home/runner/.ssh/deploy_key

jobs:
  arc:
    if: inputs.arc && github.ref == 'refs/heads/main' && github.actor == 'phezman'
    runs-on: [self-hosted, wf-ci, wf-ci-deploy-arc]
    environment: production
    timeout-minutes: 60
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # icd-pin.sh deploy and build.mjs --check read the icd/* tags
          clean: false
      - &clean
        name: clean, keeping the build caches
        run: git clean -ffdx -e target/
      - &ssh
        name: the deploy key, and the boxes' host keys only
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$KEY" > "$DEPLOY_KEY" && chmod 0600 "$DEPLOY_KEY"
          printf 'Host *\n  UserKnownHostsFile %s\n  StrictHostKeyChecking yes\n' "$GITHUB_WORKSPACE/.github/known_hosts" > ~/.ssh/config
      - run: make deploy-arc

  door:
    needs: arc
    if: ${{ !cancelled() && !failure() && inputs.door && github.ref == 'refs/heads/main' && github.actor == 'phezman' }}
    runs-on: [self-hosted, wf-ci, wf-ci-deploy-door]
    environment: production
    timeout-minutes: 60
    steps:
      - *checkout
      - *clean
      - *ssh
      - run: make deploy-door

  app:
    needs: door
    if: ${{ !cancelled() && !failure() && inputs.app && github.ref == 'refs/heads/main' && github.actor == 'phezman' }}
    runs-on: [self-hosted, wf-ci, wf-ci-deploy-app]
    environment: production
    timeout-minutes: 15
    steps:
      - *checkout
      - *clean
      - *ssh
      - run: make deploy-app

  docs:
    if: inputs.docs && github.ref == 'refs/heads/main' && github.actor == 'phezman'
    runs-on: [self-hosted, wf-ci, wf-ci-deploy-docs]
    environment: production
    timeout-minutes: 15
    steps:
      - *checkout
      - *clean
      - *ssh
      - run: make deploy-docs
