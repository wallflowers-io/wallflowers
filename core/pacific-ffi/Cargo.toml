# pacific-ffi — the ONE language boundary: a UniFFI facade over pacific-core::Node.
# Everything below this is Rust; everything above is Swift. Cross-compiled to a
# staticlib, packaged into PacificCoreRS.xcframework, imported by the iOS app.
[package]
name = "pacific-ffi"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lib]
name = "pacific_ffi"
# staticlib = the .a linked into the app; lib = so host tools can read metadata.
crate-type = ["staticlib", "lib"]

[dependencies]
pacific-media = { path = "../pacific-media" }
pacific-core = { workspace = true }
# The fold cache (O-69): its measure, installed as the global allocator, and the build stamp
# that names its model; build-ios.sh fills ARC_BUILD_*.
pacific-counting = { workspace = true }
arc-build = { workspace = true }
uniffi = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# async FFI: the N-member object_post publishes to the relay (uniffi tokio runtime).
tokio = { workspace = true }
# The core's events, handed to the app's log (`set_log_sink`).
tracing = "0.1"
tracing-subscriber = "0.3"
# The seed words_key derives is wiped when it drops, as the core's are.
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
